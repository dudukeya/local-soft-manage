[package]
name = "soft-manage"
version = "0.1.0"
description = "Windows 优先的本地项目启动与进程管理控制台"
authors = ["Local Soft Manage Contributors"]
edition = "2021"

[lib]
name = "soft_manage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
portable-pty = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
which = "8"

[dev-dependencies]
tempfile = "3"
